# === DVF Full Resolution Training Config ===
# For: train/full_train_simple_v2.py

# General settings
sensor: WV3                  # Sensor name (WV2/WV3/QB/GF2)
seed: 0                      # Random seed
device: cuda:0               # Device to use
init: true                   # Enable initialization phase

# Training parameters
init_epochs: 6000            # Number of initialization epochs
train_epochs: 3000           # Number of training epochs
optw_lr: 0.001               # Learning rate for wnet optimizer
optX_lr: 0.5                 # Learning rate for X optimizer
lam1: 0.187                  # Lambda 1 weight for regularization
lam2: 0.383                  # Lambda 2 weight for pan consistency

# Path settings
work_dir: ./outputs/simple_full      # Working directory
data_dir: ./Data/ori_data            # Original data directory
xnet_dir: ./Data/xnet_data           # Xnet data directory
init_model: ADWM                     # Initial model name

# Sensor-specific settings
max_value:
  WV2: 2047.0
  WV3: 2047.0
  QB: 2047.0
  GF2: 1023.0

channel:
  WV2: 8
  WV3: 8
  QB: 4
  GF2: 4

bands:
  WV2: [1, 3, 5]
  WV3: [1, 3, 5]
  QB: [0, 1, 2]
  GF2: [0, 1, 2]

# Logging settings
log_interval: 500            # Log every N iterations
save_results: true           # Save output results